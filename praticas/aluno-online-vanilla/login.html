<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main>
        <header>
            <img src="public/learn.svg" alt="Capelo">
            <h1>Aluno Online</h1>
        </header>

        <form id="loginForm" novalidate>
            <label for="email">E-mail</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Digite seu e-mail"
            />
            <p 
                id="error-email" 
                class="error-message" 
                aria-live="polite"
            ></p>

            <label for="senha">Senha</label>
            <input 
                type="password" 
                id="senha" 
                name="senha" 
                placeholder="Digite sua senha"
            />
            <p 
                id="error-senha" 
                class="error-message" 
                aria-live="polite"
            ></p>
            
            <button type="submit">Entrar</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026. Todos os direitos reservados.</p>
    </footer>
    <script type="module" src="src/main.js"></script>
</body>
</html>
